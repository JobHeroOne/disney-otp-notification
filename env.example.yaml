# Voorbeeldconfiguratie. Vervang placeholders uitsluitend in je PRIVATE env.yaml.
# Commit NOOIT env.yaml of echte telefoonnummers.
GMAIL_ADDRESS: "your-account@gmail.com"
ALLOWED_SENDER: "actual-disney-sender@example.com"
GMAIL_LABEL: "Disney-OTP"
SMS_RECIPIENTS: "+31600000001,+31600000002"
BIRD_WORKSPACE_ID: "your-workspace-id"
BIRD_CHANNEL_ID: "your-sms-channel-id"
# Alleen nodig indien de huidige broncode de oude instelling nog verwacht:
BIRD_SENDER: "UNUSED_WITH_BIRD_CHANNELS_API"
# Geheimen komen NIET in env.yaml. Cloud Run gebruikt Secret Manager:
# GMAIL_OAUTH_CREDENTIALS <- gmail-oauth-credentials
# BIRD_API_KEY           <- bird-api-key
